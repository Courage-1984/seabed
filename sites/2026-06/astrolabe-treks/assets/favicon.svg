<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="4" fill="url(#bg)" />
  
  <!-- Outer Ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="url(#bronze)" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Inner Ring -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="url(#bronze)" stroke-width="1" />
  
  <!-- Crosshairs -->
  <line x1="16" y1="2" x2="16" y2="30" stroke="url(#bronze)" stroke-width="1" />
  <line x1="2" y1="16" x2="30" y2="16" stroke="url(#bronze)" stroke-width="1" />
  
  <!-- Compass Star -->
  <polygon points="16,6 18,14 26,16 18,18 16,26 14,18 6,16 14,14" fill="url(#bronze)" />
  
  <!-- Center Pin -->
  <circle cx="16" cy="16" r="2" fill="#fff" />
</svg>
