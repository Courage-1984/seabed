<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#003DFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Plate -->
  <rect width="100" height="100" rx="16" fill="#111318" stroke="#1A202C" stroke-width="2"/>
  
  <!-- Outer Hexagon ring -->
  <path d="M 50,15 L 80,32.5 L 80,67.5 L 50,85 L 20,67.5 L 20,32.5 Z" fill="none" stroke="url(#grad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner geometric form (crystal/ice facet) -->
  <path d="M 50,25 L 70,40 L 50,70 L 30,40 Z" fill="#00D4FF" opacity="0.8" />
  <path d="M 50,25 L 70,40 L 50,50 Z" fill="#FFFFFF" opacity="0.3" />
  <path d="M 50,25 L 50,50 L 30,40 Z" fill="#FFFFFF" opacity="0.1" />

  <!-- Core dot -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF" filter="url(#glow)"/>
</svg>
