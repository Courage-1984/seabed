<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fiber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="12" fill="#18181B" />
  <!-- Stone arch shape -->
  <path d="M 20,80 L 20,40 C 20,20 80,20 80,40 L 80,80 L 65,80 L 65,40 C 65,30 35,30 35,40 L 35,80 Z" fill="#52525B"/>
  <!-- Fiber optic line threading through -->
  <path d="M 10,60 C 30,50 40,80 50,60 C 60,40 70,60 90,50" fill="none" stroke="url(#fiber)" stroke-width="6" stroke-linecap="round"/>
</svg>
