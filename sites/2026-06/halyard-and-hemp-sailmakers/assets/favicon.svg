<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sail-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <!-- Sail shape -->
  <path d="M 40,20 C 60,30 80,60 70,80 C 45,75 30,55 30,80 L 30,20 Z" fill="url(#sail-grad)" stroke="#F8FAFC" stroke-width="2"/>
  <!-- Mast -->
  <line x1="30" y1="15" x2="30" y2="85" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <!-- Details -->
  <path d="M 30,40 C 45,45 55,60 55,75" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
