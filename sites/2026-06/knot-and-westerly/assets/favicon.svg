  <path d="M 20,40 L 50,30 L 80,40" fill="none" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round"/>
  <path d="M 25,60 L 50,50 L 75,60" fill="none" stroke="#71717A" stroke-width="4" stroke-linecap="round"/>
  <!-- Canopy Pod -->
  <rect x="42" y="15" width="16" height="16" rx="4" fill="#38BDF8" />
  <circle cx="20" cy="40" r="4" fill="#E4E4E7" />
  <circle cx="80" cy="40" r="4" fill="#E4E4E7" />
</svg>
