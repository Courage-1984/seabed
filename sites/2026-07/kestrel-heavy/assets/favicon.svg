<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#FAF8F5" />
  <!-- Hexagon Drone Frame -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="#EA580C" stroke-width="6"/>
  <!-- Rotor indicators -->
  <circle cx="50" cy="10" r="5" fill="#3F3F46"/>
  <circle cx="85" cy="30" r="5" fill="#3F3F46"/>
  <circle cx="85" cy="70" r="5" fill="#3F3F46"/>
  <circle cx="50" cy="90" r="5" fill="#3F3F46"/>
  <circle cx="15" cy="70" r="5" fill="#3F3F46"/>
  <circle cx="15" cy="30" r="5" fill="#3F3F46"/>
  <!-- Package/Part -->
  <rect x="35" y="40" width="30" height="20" fill="#52525B"/>
  <!-- Crosshair -->
  <path d="M 50,30 L 50,40 M 50,60 L 50,70 M 35,50 L 25,50 M 65,50 L 75,50" fill="none" stroke="#EA580C" stroke-width="3"/>
</svg>
