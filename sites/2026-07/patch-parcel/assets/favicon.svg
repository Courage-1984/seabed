<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F4F4F5" />
  <!-- Fabric Patch -->
  <rect x="25" y="25" width="50" height="50" fill="#2563EB" rx="4" />
  <!-- Sashiko Crosses -->
  <path d="M 35,35 L 45,45 M 45,35 L 35,45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 55,35 L 65,45 M 65,35 L 55,45" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 35,55 L 45,65 M 45,55 L 35,65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Needle -->
  <line x1="80" y1="20" x2="60" y2="60" stroke="#71717A" stroke-width="2" stroke-linecap="round"/>
  <circle cx="80" cy="20" r="1.5" fill="#F4F4F5" stroke="#71717A" stroke-width="1"/>
  <!-- Thread -->
  <path d="M 80,20 Q 95,50 65,65 T 55,55" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
