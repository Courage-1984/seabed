<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0B" />
  <!-- Sound waves entering -->
  <path d="M 10,50 Q 20,20 30,50 T 50,50" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <!-- The Monolith -->
  <rect x="40" y="20" width="30" height="60" fill="#262626" stroke="#404040" stroke-width="2"/>
  <!-- Flat line inside/exiting -->
  <line x1="55" y1="50" x2="85" y2="50" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <!-- Anechoic Wedges -->
  <polygon points="40,30 45,35 40,40" fill="#171717"/>
  <polygon points="40,50 45,55 40,60" fill="#171717"/>
  <polygon points="40,70 45,75 40,80" fill="#171717"/>
</svg>
