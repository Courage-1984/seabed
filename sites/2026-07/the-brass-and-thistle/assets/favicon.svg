  <circle cx="50" cy="50" r="15" fill="#fcd34d" />
  <!-- Thistle leaves -->
  <path d="M 50,70 Q 20,80 10,60 Q 30,75 50,70" fill="#65a30d" />
  <path d="M 50,70 Q 80,80 90,60 Q 70,75 50,70" fill="#65a30d" />
  <!-- Flame/flower -->
  <path d="M 50,45 Q 40,25 50,15 Q 60,25 50,45" fill="#f97316" />
</svg>
