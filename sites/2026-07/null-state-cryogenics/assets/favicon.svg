<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0A" />
  <!-- Hexagonal Ice Block -->
  <polygon points="50,15 80,30 80,70 50,85 20,70 20,30" fill="#0EA5E9" opacity="0.2"/>
  <polygon points="50,15 80,30 50,45 20,30" fill="#38BDF8" opacity="0.4"/>
  <polygon points="50,45 80,30 80,70 50,85" fill="#0284C7" opacity="0.6"/>
  <polygon points="20,30 50,45 50,85 20,70" fill="#0369A1" opacity="0.8"/>
  <!-- Inner Core -->
  <circle cx="50" cy="50" r="10" fill="#F0F9FF"/>
</svg>
