<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0A0A0A" />
  
  <!-- Grid -->
  <path d="M 0,20 L 100,20 M 0,40 L 100,40 M 0,60 L 100,60 M 0,80 L 100,80" stroke="#1A1A1A" stroke-width="1" />
  <path d="M 20,0 L 20,100 M 40,0 L 40,100 M 60,0 L 60,100 M 80,0 L 80,100" stroke="#1A1A1A" stroke-width="1" />
  
  <!-- Crane Hook -->
  <path d="M 50,0 L 50,15 L 45,20 L 45,25 Q 50,30 55,25 L 55,20 L 50,15" fill="#FACC15" />
  <path d="M 45,25 L 35,40 M 55,25 L 65,40" stroke="#FACC15" stroke-width="2" />
  
  <!-- Block Letter G -->
  <path d="M 35,40 L 65,40 L 65,55 L 75,55 L 75,90 L 25,90 L 25,40 L 35,40 Z" fill="#3F3F46" stroke="#A1A1AA" stroke-width="2" />
  <!-- G details -->
  <path d="M 40,55 L 55,55 L 55,75 L 40,75 Z" fill="#0A0A0A" />
  <path d="M 55,65 L 65,65" stroke="#A1A1AA" stroke-width="2" />
</svg>
