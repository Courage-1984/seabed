<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#232b36"/>
  <!-- Stylised six-row barley ear -->
  <g transform="translate(50, 95) scale(0.9) translate(-50, -100)">
    <!-- Stem -->
    <line x1="50" y1="100" x2="50" y2="10" stroke="#f7b91c" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Central Grains -->
    <path d="M50 80 Q60 65 50 50 Q40 65 50 80" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M50 65 Q60 50 50 35 Q40 50 50 65" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M50 50 Q60 35 50 20 Q40 35 50 50" fill="none" stroke="#f7b91c" stroke-width="3"/>

    <!-- Left Grains -->
    <path d="M47 75 Q32 75 35 55 Q48 65 47 75" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M47 60 Q32 60 35 40 Q48 50 47 60" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M47 45 Q32 45 35 25 Q48 35 47 45" fill="none" stroke="#f7b91c" stroke-width="3"/>

    <!-- Right Grains -->
    <path d="M53 75 Q68 75 65 55 Q52 65 53 75" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M53 60 Q68 60 65 40 Q52 50 53 60" fill="none" stroke="#f7b91c" stroke-width="3"/>
    <path d="M53 45 Q68 45 65 25 Q52 35 53 45" fill="none" stroke="#f7b91c" stroke-width="3"/>

    <!-- Awns (bristles) -->
    <line x1="50" y1="20" x2="50" y2="5" stroke="#f7b91c" stroke-width="1.5"/>
    <line x1="35" y1="25" x2="25" y2="10" stroke="#f7b91c" stroke-width="1.5"/>
    <line x1="65" y1="25" x2="75" y2="10" stroke="#f7b91c" stroke-width="1.5"/>
    <line x1="35" y1="40" x2="20" y2="25" stroke="#f7b91c" stroke-width="1.5"/>
    <line x1="65" y1="40" x2="80" y2="25" stroke="#f7b91c" stroke-width="1.5"/>
  </g>
</svg>
