<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" />
  
  <!-- Outer glowing circuitry -->
  <path d="M 20 50 L 35 50 M 80 50 L 65 50 M 50 20 L 50 35 M 50 80 L 50 65" stroke="#0284C7" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 30 30 L 40 40 M 70 70 L 60 60 M 70 30 L 60 40 M 30 70 L 40 60" stroke="#0284C7" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Central silicon chip -->
  <rect x="35" y="35" width="30" height="30" rx="4" fill="url(#chipGrad)" filter="url(#glow)" />
  <rect x="42" y="42" width="16" height="16" rx="2" fill="#0F172A" />
  
  <!-- Circuit pins -->
  <circle cx="20" cy="50" r="3" fill="#38BDF8" />
  <circle cx="80" cy="50" r="3" fill="#38BDF8" />
  <circle cx="50" cy="20" r="3" fill="#38BDF8" />
  <circle cx="50" cy="80" r="3" fill="#38BDF8" />
</svg>
