<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)" />

  <!-- Mountain Peak Base -->
  <path d="M16 8 L26 24 L6 24 Z" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Glowing Neon Pulse -->
  <path d="M4 18 L10 18 L13 10 L19 26 L22 18 L28 18" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
</svg>
