name: QA Sweep

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # puppeteer@25 engines.node is >=22.12.0
          node-version: 22
          cache: 'npm'
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Ensure Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
      - name: Build
        run: npm run build
      - name: Site contract
        run: npm run check:contract -- --all
      # The device matrix defaults to ten devices; across all 88 sites that is
      # ten navigations per page. `fast` keeps CI to the four widths that
      # actually catch regressions (320 / 393 / 768 / 1440) -- 320px in
      # particular, which nothing tested before. Run the full matrix locally
      # per slug via `npm run qa -- <slug>`.
      - name: Puppeteer QA
        run: npm run qa -- --devices fast
        env:
          CI: true
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-report.json
            qa-screenshots/
          if-no-files-found: ignore
